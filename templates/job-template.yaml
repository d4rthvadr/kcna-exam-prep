apiVersion: batch/v1
kind: Job
metadata:
  name: example-job
  namespace: default
spec:
  template:
    spec:
      containers:
      - name: job-container
        image: busybox:latest
        command: ["sh", "-c"]
        args: ["echo 'Job executed successfully'; sleep 10"]
      restartPolicy: Never
  backoffLimit: 3
  completions: 1
  parallelism: 1
